# Tripwire - local stack for trying the daemon mode.
#   docker compose up -d
#   curl localhost:8080/healthz
# Point your OpenAI client at base_url=http://localhost:8080/v1 and send your own
# key as the Authorization Bearer; the proxy holds no upstream key.

services:
  tripwire:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripwire-daemon
    environment:
      # Pinned upstream (defaults to https://api.openai.com/v1).
      TRIPWIRE_UPSTREAM_URL: "${TRIPWIRE_UPSTREAM_URL:-https://api.openai.com/v1}"
      # Require this token as the X-Tripwire-Token header on chat completions; /healthz stays open.
      TRIPWIRE_PROXY_TOKEN: "${TRIPWIRE_PROXY_TOKEN:-}"
      TRIPWIRE_LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 8s
    restart: unless-stopped
    # On SIGTERM the proxy drains open streams for up to TRIPWIRE_MAX_STREAM_MS
    # (120 s by default); give it that long before Docker kills it.
    stop_grace_period: 125s
