name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint || true
      - run: npm run typecheck
      - run: npm test -- --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tripwire:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build daemon image
        run: docker build -t tripwire:e2e .

      - name: Start daemon
        run: |
          docker run -d --rm --name trip-e2e -p 8080:8080 tripwire:e2e

      - name: Wait for daemon healthz
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/healthz; then echo "OK"; exit 0; fi
            sleep 2
          done
          echo "daemon not responding"
          exit 1

      - name: Stop daemon
        run: docker stop trip-e2e

  publish-npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, docker]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: Publish image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ykstorm/tripwire:latest
            ghcr.io/ykstorm/tripwire:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
