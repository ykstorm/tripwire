name: Publish
on:
  push:
    tags: ['v*']
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with Node 22 is older.
      # Pinned to the 11.x line so a new major npm cannot change the release job unannounced.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      # npm authenticates with the OIDC token, so no NODE_AUTH_TOKEN is set.
      - run: npm publish --provenance --access public

  docker:
    # The image is only worth pushing for a release whose tests passed and
    # whose package went out.
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/ykstorm/tripwire
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
