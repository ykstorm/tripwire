name: Benchmark
on:
  push:
    branches: [main]
    paths: ['bench/**', 'src/**', '.github/workflows/benchmark.yml']
  pull_request:
    paths: ['bench/**', 'src/**']
  workflow_dispatch:
jobs:
  per-chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Run per-chunk overhead benchmark
        run: node bench/per-chunk.mjs | tee bench/results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: per-chunk
          path: bench/results.txt
